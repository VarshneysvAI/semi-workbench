name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (tsc + oxlint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --quiet \
            "fastapi==0.115.0" "uvicorn[standard]==0.30.6" "pandas==2.2.2" \
            "openpyxl==3.1.5" "python-multipart==0.0.9" "websockets==12.0" \
            "beautifulsoup4==4.12.3" "lxml==5.3.0" "httpx==0.28.1" "pytest==9.1.1" \
            "python-dotenv==1.0.1" "google-genai==2.17.0" "ddgs>=9.0.0"
      - name: Run tests
        run: python -m pytest backend/tests -q